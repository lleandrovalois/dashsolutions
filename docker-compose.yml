version: '3.8'

services:
  web:
    build: .
    container_name: dash-solutions
    restart: unless-stopped
    ports:
      - "${PORT:-8086}:80"
    volumes:
      - ./theme.json:/app/theme.json
      - ./portfolio.json:/app/portfolio.json
      - ./content.json:/app/content.json
    environment:
      - PORT=80
      - VIRTUAL_HOST=dash.klynner.com.br
      - LETSENCRYPT_HOST=dash.klynner.com.br
